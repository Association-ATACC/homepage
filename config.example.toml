[server]
# Public URL of the site, used to build the confirmation link sent by email.
# In development, localhost is fine; in production, set the real URL, e.g.
# "https://inscription.atacc.org".
public_url = "http://127.0.0.1:3000"

[database]
# Path of the SQLite database file. It is created and migrated automatically
# when the server starts if it does not exist yet.
path = "atacc.db"

[smtp]
host = "smtp.example.org"
port = 587
username = "no-reply@atacc.org"
password = "change-me"
# Address (with an optional display name) used as the sender.
from_address = "ATACC <no-reply@atacc.org>"
# Transport security: "none", "smtps" or "starttls" (default).
# security = "smtps"
